  // ---- Helpers ----
  function batchById(id){ return BATCHES.filter(function(b){return b.id===Number(id);})[0]; }
  function bLabel(b){ return b.subject+(b.time?', '+b.time:''); }
  function inBatch(s,bid){ return (s.bs||[]).indexOf(Number(bid))>-1; }
  function batchStudents(bid){ return students.filter(function(s){return inBatch(s,bid);}); }
  function sBatches(s){ return (s.bs||[]).map(batchById).filter(Boolean); }
  function sBatchText(s){ var l=sBatches(s).map(bLabel); return l.length ? l.join(' | ') : 'No batch'; }
  function mk(bid,sid){ var m=state.marks[bid]; return (m && m[sid]) || 'P'; }
  function setMk(bid,sid,v){ if(!state.marks[bid]) state.marks[bid]={}; state.marks[bid][sid]=v; }
  function byId(id){ return students.filter(function(s){return s.id===Number(id);})[0]; }
  function pend(s){ return s.billed - s.paid; }
  function dueDate(s){ return addDays(TODAY, -s.dueAgo); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function daysAgoFromIso(v){ var d=new Date(v+'T00:00:00'); if(isNaN(d.getTime())) return null; return Math.round((TODAY-d)/86400000); }
  function wa(phone,msg){ return 'https://wa.me/91'+phone+'?text='+encodeURIComponent(msg); }
  function sum(arr){ return arr.reduce(function(a,b){return a+b;},0); }
  function scored(idx){ return students.filter(function(x){return x.scores[idx]!=null;}); }
  function rankOf(idx,id){ var v=byId(id).scores[idx]; if(v==null) return null; return 1+scored(idx).filter(function(x){return x.scores[idx]>v;}).length; }
  function classAvg(idx){ var a=scored(idx); return a.length ? sum(a.map(function(x){return x.scores[idx];}))/a.length : null; }
  function tsub(i){ return (testSubj[i] || '').trim() || 'Weekly test'; }
  function tmax(i){ return testMax[i] || MAXM; }
  function passMark(i){ return Math.round(tmax(i)*PASSP)/100; }
  function isPass(v,i){ return v!=null && v>=passMark(i); }
  function resultOf(v,i){ return v==null ? '-' : (isPass(v,i) ? 'Pass' : 'Fail'); }
  function setTotal(idx,raw){
    var tv=Number(raw);
    if(raw===''||!isFinite(tv)||tv<1||tv>1000||Math.floor(tv)!==tv) return 'Enter the test total as a whole number from 1 to 1000.';
    var hi=0; students.forEach(function(x){ if(x.scores[idx]!=null && x.scores[idx]>hi) hi=x.scores[idx]; });
    if(tv<hi) return 'Some saved scores for this test are above '+tv+'. Use at least '+Math.ceil(hi)+'.';
    testMax[idx]=tv; return '';
  }
  function attPct(s){ var c=attCount(s); return c[1] ? Math.round(100*c[0]/c[1]) : null; }
  function attCount(s){ var p=s.att[0], t=s.att[1]; (s.bs||[]).forEach(function(b){ if(state.savedB[b]){ t++; if(mk(b,s.id)!=='A') p++; } }); return [p,t]; }
  function feeMsg(s){
    var late = s.dueAgo>0, base = 'Namaste '+s.parent+', a reminder from '+CENTRE+': '+s.name+"'s fee of "+inr(pend(s));
    base += late ? ' was due on '+fmt(dueDate(s))+' ('+s.dueAgo+' days ago).' : ' is due on '+fmt(dueDate(s))+' (in '+(-s.dueAgo)+' days).';
    return base+' You can pay by UPI to '+UPI_ID+'. Please ignore this message if you have already paid. Thank you.';
  }

  function chartSvg(s){
    var W=340,H=200,L=30,R=8,T=18,B=30,iw=W-L-R,ih=H-T-B,n=6,slot=iw/n,bw=slot*0.56;
    var CM=Math.max.apply(null,[0,1,2,3,4,5].map(tmax));
    function y(v){ return T+ih-(v/CM)*ih; }
    var g='', i, v, pts=[];
    [0,1,2,3,4,5].map(function(k){ return +(CM*k/5).toFixed(1); }).forEach(function(t){
      g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(t)+3)+'" text-anchor="end">'+t+'</text>';
    });
    for(i=0;i<n;i++){
      v=s.scores[i];
      var x=L+slot*i+(slot-bw)/2, cx=x+bw/2, av=classAvg(i);
      if(v!=null){
        g+='<rect class="bar'+(i===n-1?' now':'')+'" x="'+x.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(T+ih-y(v)).toFixed(1)+'" rx="3"/>';
        g+='<text class="val" x="'+cx.toFixed(1)+'" y="'+(y(v)-5).toFixed(1)+'" text-anchor="middle">'+v+'</text>';
      }
      g+='<text class="ax" x="'+cx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+fmt(testDates[i])+'</text>';
      if(av!=null) pts.push([cx,y(av)]);
    }
    if(pts.length>1) g+='<polyline class="avg" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
    pts.forEach(function(p){ g+='<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.8"/>'; });
    var lab = s.scores.map(function(x){return x==null?'no score':x;}).join(', ');
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Last 6 test scores (axis up to '+CM+'): '+lab+'">'+g+'</svg>';
  }

  function passFailCard(){

  // ---- Saving on this device ----
  var KEY = 'tuitiondesk-v1';
  function snapshot(){
    return ({day:TODAY.toDateString(), students:students, enquiries:enquiries, cfg:{centre:CENTRE, upi:UPI_ID, maxm:MAXM, logo:LOGO, offer:OFFER, phone:PHONE, social:SOCIAL, passp:PASSP, gid:GCLIENT}, testSubj:testSubj, testMax:testMax, queries:queries, templates:templates, nextId:nextId, marks:state.marks, savedB:state.savedB, batches:BATCHES, nextBatchId:nextBatchId});
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(snapshot())); }catch(e){}
    cloudQueue();
  }
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(!d || !d.students) return;
      if(d.cfg){ CENTRE = d.cfg.centre || CENTRE; UPI_ID = d.cfg.upi || UPI_ID; MAXM = d.cfg.maxm || MAXM; LOGO = d.cfg.logo || ''; if(d.cfg.offer!=null) OFFER = d.cfg.offer; PHONE = d.cfg.phone || ''; if(d.cfg.social) SOCIAL = d.cfg.social; if(d.cfg.passp) PASSP = d.cfg.passp; if(d.cfg.gid) GCLIENT = d.cfg.gid; }
      if(d.testSubj && d.testSubj.length===6) testSubj = d.testSubj;
      if(d.testMax && d.testMax.length===6) testMax = d.testMax;
      if(d.queries) queries = d.queries;
      if(d.templates) templates = d.templates;
      students = d.students; enquiries = d.enquiries || enquiries; nextId = d.nextId || nextId;
      var oldFmt = !(d.batches && d.batches.length);
      if(oldFmt){ BATCHES = [BATCHES[0]]; nextBatchId = 2; }
      else { BATCHES = d.batches; nextBatchId = d.nextBatchId || (BATCHES.reduce(function(m,x){return Math.max(m,x.id);},0)+1); }
      students.forEach(function(s){ if(!s.bs) s.bs = [BATCHES[0].id]; });
      var dm = oldFmt ? {} : (d.marks || {}), dsv = oldFmt ? {} : (d.savedB || {});
      var old = new Date(d.day); old.setHours(0,0,0,0);
      var diff = Math.round((TODAY-old)/86400000);
      if(diff>0){
        students.forEach(function(s){
          s.bs.forEach(function(bid){ if(dsv[bid]){ s.att[1]+=1; if(!(dm[bid] && dm[bid][s.id]==='A')) s.att[0]+=1; } });
          if(pend(s)>0) s.dueAgo += diff;
        });
        enquiries.forEach(function(q){ q.ago += diff; });
        state.marks = {}; state.savedB = {};
      } else { state.marks = dm; state.savedB = dsv; }
      if(!batchById(state.attBatch)) state.attBatch = BATCHES[0].id;
      var first = students.length ? students[0].id : null;
      if(!byId(state.testStu)) state.testStu = first;
      if(!byId(state.parentStu)) state.parentStu = first;
    }catch(e){}
  }

  // ---- Queries and score upload ----
  function timeAgo(ts){
    var m=Math.round((Date.now()-ts)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago';
    var h=Math.round(m/60); if(h<24) return h+' h ago';
    var d=Math.round(h/24); return d+(d===1?' day ago':' days ago');
  }
  function thread(sid){ return queries.filter(function(q){return q.stuId===sid;}).sort(function(a,b){return a.ts-b.ts;}); }
  function nextQ(){ return queries.reduce(function(m,q){return Math.max(m,q.id);},0)+1; }
  function replyCount(){
    return students.filter(function(st){ var th=thread(st.id); return th.length && th[th.length-1].from==='parent'; }).length;
  }

    if(utot){ var terr=setTotal(idx,utot.value.trim()); if(terr){ state.upMsg={ok:0,bad:[terr],idx:idx}; state.upText=txt; render(); toast('No scores imported'); return; } }
    txt.split(/\r?\n/).forEach(function(line,i){
      line=line.trim(); if(!line) return;
      var parts=line.split(/[,\t;]/);
      if(parts.length<2){ bad.push(line+' (needs name and score)'); return; }
      var raw=parts[parts.length-1].trim(), name=parts.slice(0,-1).join(',').replace(/^"|"$/g,'').replace(/\s+/g,' ').trim(), v=Number(raw);
      if(raw===''||!isFinite(v)){ if(i===0) return; bad.push(name+' (score "'+raw+'" is not a number)'); return; }
      if(v<0||v>tmax(idx)){ bad.push(name+' (score '+raw+' is outside 0 to '+tmax(idx)+')'); return; }
      var st=students.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];
      if(!st){ bad.push(name+' (not in student list)'); return; }
      st.scores[idx]=Math.round(v*2)/2; upd++;
    });
    state.upMsg={ok:upd, bad:bad, idx:idx};
    if(!bad.length && upd) state.upText='';
    else state.upText=txt;
    render();
    toast(upd?upd+' score'+(upd===1?'':'s')+' imported':'No scores imported');
  }

    r.onerror=function(){ toast('Could not read that file.'); };

  }

  // ---- Export all data as PDF ----
  function makePdf(){
    var PW=595, PH=842, M=40, CW=PW-2*M, pages=[], ops, y, imgs=[];
    function np(){ ops=[]; pages.push(ops); y=PH-M; }
    function clean(s){
      return String(s==null?'':s).replace(/₹/g,'Rs.').replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
        .replace(/[–—−]/g,'-').replace(/·/g,'-').replace(/…/g,'...').replace(/\s+/g,' ').replace(/[^\x20-\x7E]/g,'?');
    }
    function esc2(s){ return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
    function put(o,x,yy,s,size,bold){ o.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+x.toFixed(1)+' '+yy.toFixed(1)+' Td ('+esc2(clean(s))+') Tj ET'); }
    function fit(s,w,size){ s=clean(s); var max=Math.floor(w/(size*0.54)); return s.length>max ? s.slice(0,Math.max(0,max-3))+'...' : s; }
    function wrap(s,w,size){
      var max=Math.max(8,Math.floor(w/(size*0.54))), words=clean(s).split(' '), lines=[], cur='';
      words.forEach(function(wd){
        while(wd.length>max){ if(cur){ lines.push(cur); cur=''; } lines.push(wd.slice(0,max)); wd=wd.slice(max); }
        if((cur+' '+wd).trim().length>max){ lines.push(cur); cur=wd; } else cur=(cur+' '+wd).trim();
      });
      if(cur) lines.push(cur);
      return lines.length?lines:[''];
    }
    function need(h){ if(y-h<M+16) np(); }
    np();
    var api = {
      title:function(t,sub){ put(ops,M,y-18,t,20,true); y-=26; put(ops,M,y-12,sub,9,false); y-=22; },
      h:function(t,note){ need(60); y-=10; put(ops,M,y-12,t,13,true); y-=17; if(note){ put(ops,M,y-9,note,8.5,false); y-=13; } ops.push('0.75 G 0.6 w '+M+' '+(y-2)+' m '+(PW-M)+' '+(y-2)+' l S'); y-=8; },
      p:function(t,size,bold){ size=size||9.5; wrap(t,CW,size).forEach(function(l){ need(size+5); put(ops,M,y-size,l,size,!!bold); y-=size+4; }); },
      photo:function(url,size){
        try{
          var bin=atob(String(url).split(',')[1]||'');
          if(bin.length<4 || bin.charCodeAt(0)!==255 || bin.charCodeAt(1)!==216 || imgs.length) return;
          imgs.push({d:bin});
          var px=PW-M-size, py=PH-M-size;
          pages[0].push('q '+size+' 0 0 '+size+' '+px+' '+py+' cm /Im0 Do Q');
          pages[0].push('0.8 G 0.6 w '+px+' '+py+' '+size+' '+size+' re S');
        }catch(e){}
      },
      gap:function(n){ y-=n; },
      table:function(cols,rows){
        var RH=16, FS=9;
        function head(){
          need(RH*2); ops.push('0.89 0.95 0.92 rg '+M+' '+(y-RH)+' '+CW+' '+RH+' re f 0 g');
          var x=M; cols.forEach(function(c){ var s=fit(c.t,c.w-8,FS), tx=c.a==='r'?x+c.w-4-s.length*FS*0.54:x+4; put(ops,tx,y-RH+5,s,FS,true); x+=c.w; });
          y-=RH;
        }
        head();
        if(!rows.length){ need(RH); put(ops,M+4,y-RH+5,'No data',FS,false); y-=RH; return; }
        rows.forEach(function(r){
          if(y-RH<M+16){ np(); head(); }
          var x=M; cols.forEach(function(c,i){ var s=fit(r[i],c.w-8,FS), tx=c.a==='r'?x+c.w-4-s.length*FS*0.54:x+4; put(ops,tx,y-RH+5,s,FS,!!r.bold); x+=c.w; });
          ops.push('0.85 G 0.4 w '+M+' '+(y-RH)+' m '+(PW-M)+' '+(y-RH)+' l S');
          y-=RH;
        });
      },
      finish:function(footer){
        var n=pages.length;
        pages.forEach(function(o,i){ put(o,M,22,footer,8,false); var t='Page '+(i+1)+' of '+n; put(o,PW-M-t.length*8*0.54,22,t,8,false); });
        var objs=[], kids=[], i;
        objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
        objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
        objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
        for(i=0;i<n;i++){
          var cs=pages[i].join('\n'), cid=5+2*i, pid=6+2*i;
          objs[cid]='<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream';
          objs[pid]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>'+(imgs.length?' /XObject << /Im0 '+(5+2*n)+' 0 R >>':'')+' >> /Contents '+cid+' 0 R >>';
          kids.push(pid+' 0 R');
        }
        if(imgs.length) objs[5+2*n]='<< /Type /XObject /Subtype /Image /Width 240 /Height 240 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+imgs[0].d.length+' >>\nstream\n'+imgs[0].d+'\nendstream';
        objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>';
        var out='%PDF-1.4\n', offs=[];
        for(i=1;i<objs.length;i++){ offs[i]=out.length; out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'; }
        var xr=out.length;
        out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
        for(i=1;i<objs.length;i++){ out+=String(offs[i]).padStart(10,'0')+' 00000 n \n'; }
        out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
        var bytes=new Uint8Array(out.length);
        for(i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
        return bytes;
      }
    };
    return api;
  }

  function loadImg(src){

  }
  function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  function fitText(c,t,maxW){ t=String(t); if(c.measureText(t).width<=maxW) return t; while(t.length>1 && c.measureText(t+'\u2026').width>maxW) t=t.slice(0,-1); return t+'\u2026'; }
  function cardCanvas(s){
    return Promise.all([loadImg(s.photo), loadImg(LOGO)]).then(function(im){
      var W=856, H=540, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      var c=cv.getContext('2d'), F='Figtree, -apple-system, Segoe UI, Arial, sans-serif';

      c.fillStyle='#ffffff'; c.fillRect(0,0,W,H);
      c.fillStyle='#0E6B52'; c.fillRect(0,0,W,120);
      c.fillStyle='#ffffff'; rr(c,28,22,76,76,16); c.fill();
      if(im[1]){ c.save(); rr(c,32,26,68,68,12); c.clip(); c.drawImage(im[1],32,26,68,68); c.restore(); }
      else { c.strokeStyle='#0E6B52'; c.lineWidth=9; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(50,62); c.lineTo(64,76); c.lineTo(88,46); c.stroke(); }
      c.textBaseline='middle'; c.textAlign='left'; c.fillStyle='#ffffff'; c.font='700 40px '+F;
      c.fillText(fitText(c,CENTRE,W-124-28),124,60);
      var px=32, py=154, pw=230, ph=280;
      c.fillStyle='#DDF0E8'; rr(c,px,py,pw,ph,20); c.fill();
      if(im[0]){
        c.save(); rr(c,px,py,pw,ph,20); c.clip();
        var iw=im[0].width, ih=im[0].height, k=Math.max(pw/iw,ph/ih), dw=iw*k, dh=ih*k;
        c.drawImage(im[0],px+(pw-dw)/2,py+(ph-dh)/2,dw,dh); c.restore();
      } else {
        c.fillStyle='#0E6B52'; c.font='700 90px '+F; c.textAlign='center'; c.fillText(initials(s.name),px+pw/2,py+ph/2); c.textAlign='left';
      }
      c.strokeStyle='#0E6B52'; c.lineWidth=5; rr(c,px,py,pw,ph,20); c.stroke();
      var tx=294, tw=W-tx-30;
      c.fillStyle='#14201B'; c.font='700 48px '+F; c.fillText(fitText(c,s.name,tw),tx,190);
      c.fillStyle='#5A6A63'; c.font='500 28px '+F; c.fillText(fitText(c,cardBatch(s),tw),tx,240);
      var rows=[['ID',idNo(s)],['Parent',s.parent],['Phone','+91 '+s.phone]], yy=316;
      rows.forEach(function(r){

        c.fillStyle='#14201B'; c.font='700 30px '+F; c.fillText(fitText(c,r[1],tw-130),tx+130,yy); yy+=62;
      });
      c.fillStyle='#DDF0E8'; c.fillRect(0,H-64,W,64);
      c.fillStyle='#0E6B52'; c.font='700 24px '+F; c.textAlign='center'; c.fillText('STUDENT ID CARD  \u00B7  '+TODAY.getFullYear(),W/2,H-32);
